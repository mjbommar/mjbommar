name: Update recent posts

on:
  schedule:
    - cron: '17 7 * * *'  # daily ~07:17 UTC; offset to avoid GitHub cron-spike
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update recent block
        run: |
          python3 scripts/update-recent.py

      - name: Commit if changed
        run: |
          if [[ -n $(git status --porcelain README.md) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore(readme): refresh recent posts"
            git push
          else
            echo "No changes to README."
          fi
