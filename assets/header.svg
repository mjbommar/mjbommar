<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" preserveAspectRatio="xMinYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">mike bommarito</title>
  <desc id="desc">builder, researcher, educator, advisor</desc>
  <style>
    :root { color-scheme: light dark; }
    .name { font-family: ui-serif, Georgia, "Times New Roman", serif; font-size: 72px; font-weight: 300; letter-spacing: -0.02em; fill: #111; }
    .tag  { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 18px; font-weight: 400; letter-spacing: 0.04em; fill: #555; }
    .rule { stroke: #ddd; stroke-width: 1; }
    .sep  { fill: #aaa; }
    @media (prefers-color-scheme: dark) {
      .name { fill: #f5f5f5; }
      .tag  { fill: #999; }
      .rule { stroke: #333; }
      .sep  { fill: #666; }
    }
  </style>
  <text x="40" y="110" class="name">mike bommarito</text>
  <line x1="40" y1="140" x2="760" y2="140" class="rule" />
  <text x="40" y="172" class="tag">builder<tspan class="sep" dx="0.8em">·</tspan><tspan dx="0.8em">researcher</tspan><tspan class="sep" dx="0.8em">·</tspan><tspan dx="0.8em">educator</tspan><tspan class="sep" dx="0.8em">·</tspan><tspan dx="0.8em">advisor</tspan></text>
</svg>
